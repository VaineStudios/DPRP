name: Deploy to Railway

on:
  push:
    branches: [railway-deploy]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Build clients ────────────────────────────────────
      - name: Install & build client-admin
        working-directory: client-admin
        run: npm ci && npm run build

      - name: Install & build client-resident
        working-directory: client-resident
        run: npm ci && tsc -b && npx vite build --base /resident/

      - name: Install & build client-shelter
        working-directory: client-shelter
        run: npm ci && tsc -b && npx vite build --base /shelter/

      # ── Copy client builds into server/public/ ───────────
      - name: Assemble static files
        run: |
          mkdir -p server/public
          cp -r client-admin/dist server/public/client-admin
          cp -r client-resident/dist server/public/client-resident
          cp -r client-shelter/dist server/public/client-shelter

      # ── Build server ─────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build server
        working-directory: server
        run: npm run build

      # ── Deploy to Railway ────────────────────────────────
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service dprp-server
