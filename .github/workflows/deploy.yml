name: Build & Validate

on:
  push:
    branches: [railway-deploy, dev]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Build clients ────────────────────────────────────
      - name: Install & build client-admin
        working-directory: client-admin
        run: npm ci && npm run build

      - name: Install & build client-resident
        working-directory: client-resident
        run: npm ci && tsc -b && npx vite build --base /resident/

      - name: Install & build client-shelter
        working-directory: client-shelter
        run: npm ci && tsc -b && npx vite build --base /shelter/

      # ── Build server ─────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build server
        working-directory: server
        run: npm run build
