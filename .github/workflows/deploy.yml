name: Deploy to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  SSH_PORT: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Build server ──────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build server
        working-directory: server
        run: npm run build

      # ── Build clients (parallel) ──────────────────────────
      - name: Install & build client-admin
        working-directory: client-admin
        run: npm ci && npm run build

      - name: Install & build client-resident
        working-directory: client-resident
        run: npm ci && tsc -b && npx vite build --base /resident/

      - name: Install & build client-shelter
        working-directory: client-shelter
        run: npm ci && tsc -b && npx vite build --base /shelter/

      # ── Configure SSH ─────────────────────────────────────
      - name: Diagnose EC2 SSH connectivity
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          set +e
          echo "::group::Secret presence checks"
          if [ -n "$env.EC2_HOST" ]; then
            echo "EC2_HOST is set"
          else
            echo "::error::EC2_HOST is empty or missing"
          fi
          if [ -n "$EC2_USERNAME" ]; then
            echo "EC2_USERNAME is set"
          else
            echo "::error::EC2_USERNAME is empty or missing"
          fi
          if [ -n "$EC2_SSH_KEY" ]; then
            echo "EC2_SSH_KEY is set"
          else
            echo "::error::EC2_SSH_KEY is empty or missing"
          fi
          echo "SSH_PORT=${SSH_PORT}"
          echo "::endgroup::"

          echo "::group::Runner environment"
          uname -a
          whoami
          pwd
          command -v ssh
          ssh -V
          command -v ssh-keyscan
          command -v timeout
          command -v nc || true
          command -v dig || true
          command -v host || true
          command -v getent || true
          echo "::endgroup::"

          echo "::group::DNS and network reachability"
          echo "Testing host: ${env.EC2_HOST}"
          getent hosts "$env.EC2_HOST" || true
          host "$env.EC2_HOST" || true
          dig +short "$env.EC2_HOST" || true
          ping -c 1 "$env.EC2_HOST" || true
          nc -vz "$env.EC2_HOST" "$SSH_PORT"
          echo "nc exit code: $?"
          timeout 10 bash -c "</dev/tcp/$EC2_HOST/$SSH_PORT"
          echo "/dev/tcp exit code: $?"
          echo "::endgroup::"

          echo "::group::SSH key format checks"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh
          wc -c ~/.ssh/id_rsa
          sed -n '1p;$p' ~/.ssh/id_rsa | sed 's/./*/g'
          ssh-keygen -l -f ~/.ssh/id_rsa
          echo "ssh-keygen exit code: $?"
          echo "::endgroup::"

          echo "::group::Host key scan"
          rm -f ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$env.EC2_HOST" | tee -a ~/.ssh/known_hosts
          echo "ssh-keyscan exit code: $?"
          wc -l ~/.ssh/known_hosts || true
          echo "::endgroup::"

          echo "::group::SSH handshake test"
          cat >> ~/.ssh/config <<EOF
          Host *
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 3
            Port ${SSH_PORT}
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_rsa
          EOF
          ssh -vvv -o BatchMode=yes "${EC2_USERNAME}@${env.EC2_HOST}" "echo connected && whoami && hostname"
          echo "ssh exit code: $?"
          echo "::endgroup::"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -p "${{ env.SSH_PORT }}" -H "${{ env.EC2_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host *
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 3
            Port ${{ env.SSH_PORT }}
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_rsa
          EOF

      # ── Deploy to EC2 ─────────────────────────────────────
      - name: Deploy server
        env:
          REMOTE: ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}
        run: |
          ssh $REMOTE "mkdir -p ~/dprp/server/prisma"
          rsync -avz --delete server/dist/ $REMOTE:~/dprp/server/dist/
          rsync -avz server/package.json server/package-lock.json $REMOTE:~/dprp/server/
          rsync -avz --delete server/prisma/ $REMOTE:~/dprp/server/prisma/

      - name: Deploy clients
        env:
          REMOTE: ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}
        run: |
          rsync -avz --delete client-admin/dist/ $REMOTE:~/dprp/client-admin/
          rsync -avz --delete client-resident/dist/ $REMOTE:~/dprp/client-resident/
          rsync -avz --delete client-shelter/dist/ $REMOTE:~/dprp/client-shelter/
          ssh $REMOTE "chmod -R 755 ~/dprp/client-admin ~/dprp/client-resident ~/dprp/client-shelter"

      # ── Install production deps, migrate, restart ─────────
      - name: Restart services
        env:
          REMOTE: ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}
        run: |
          ssh $REMOTE << 'ENDSSH'
            cd ~/dprp/server
            npm install --omit=dev
            npx prisma migrate deploy
            pm2 restart dprp-server 2>/dev/null || pm2 start dist/index.js --name dprp-server
            pm2 save
          ENDSSH
